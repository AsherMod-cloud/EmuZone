<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Requests — Admin EmuZone</title>
<link rel="icon" href="/assets/image/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<link rel="stylesheet" href="/admin/css/dashboard.css">
<link rel="stylesheet" href="/admin/css/sidebar.css">
<link rel="stylesheet" href="/css/error-modal.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="auth-pending">
<div class="auth-loader"><div class="spinner"></div></div>

<header class="topbar">
  <div class="topbar-heading">
    <h1>Requests</h1>
    <p>Permintaan game dari pengunjung</p>
  </div>
</header>

<main class="dash request-page">
  <section class="stats">
    <div class="stat" aria-busy="true">
      <span class="material-symbols-outlined stat-icon">inbox</span>
      <div><p>Menunggu</p><h2 id="stPending" class="stat-loading" role="status" aria-live="polite">Memuat…</h2><small>Request yang belum selesai</small></div>
    </div>
    <div class="stat" aria-busy="true">
      <span class="material-symbols-outlined stat-icon">done_all</span>
      <div><p>Selesai</p><h2 id="stDone" class="stat-loading" role="status" aria-live="polite">Memuat…</h2><small>Request yang sudah diproses</small></div>
    </div>
    <div class="stat" aria-busy="true">
      <span class="material-symbols-outlined stat-icon">format_list_bulleted</span>
      <div><p>Total request</p><h2 id="stTotal" class="stat-loading" role="status" aria-live="polite">Memuat…</h2><small>Data yang tersimpan</small></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div><h3>Daftar request</h3><p>Request terbaru ditampilkan lebih dahulu.</p></div>
      <div class="seg" id="reqSeg" role="group" aria-label="Filter request">
        <button data-f="pending" class="active" type="button">Menunggu</button>
        <button data-f="done" type="button">Selesai</button>
        <button data-f="all" type="button">Semua</button>
      </div>
    </div>
    <div id="reqList" class="req-list" aria-live="polite" aria-busy="true">
      <div class="request-state" role="status"><span class="spinner chart-spinner" aria-hidden="true"></span><strong>Memuat request...</strong></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="/js/firebase.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/error-modal.js"></script>
<script src="/admin/js/admin-utils.js"></script>
<script src="/admin/js/report-retention.js"></script>
<script src="/admin/js/sidebar.js"></script>
<script src="/admin/js/requests.js"></script>
</body>
</html>
