<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login • EmuZone</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/image/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/login.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="login-page">
<div class="login-card">

    <div class="login-logo">
        EMULATOR<span>.</span>GAMES<span>.</span>ID
    </div>

    <h2>Administrator Login</h2>

    <p>
        Sign in menggunakan akun administrator.
    </p>

    <div class="form-group">
        <label>Admin ID / Email</label>

        <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
                type="email"
                id="email"
                placeholder="Masukkan Admin ID / Email Anda">
        </div>
    </div>

    <div class="form-group">
        <label>Password</label>

        <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
                type="password"
                id="password"
                placeholder="Masukkan Password Anda"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                autocomplete="current-password">
            <button type="button" id="togglePass" class="toggle-pass" aria-label="Tampilkan password">
                <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.53M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>
    </div>

    <div class="form-group remember-row">
        <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            Ingat saya
        </label>
    </div>

    <button id="loginBtn">
        <svg id="loginSpinner" class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M5 22h14M5 2h14M7 2v3.5a5 5 0 0 0 2 4l1.5 1-1.5 1a5 5 0 0 0-2 4V22M17 2v3.5a5 5 0 0 1-2 4l-1.5 1 1.5 1a5 5 0 0 1 2 4V22"></path>
        </svg>
        <span id="loginBtnText">Login</span>
    </button>

    <div id="errorBox"></div>

    <a href="/" class="back-home">
        ← Kembali ke Homepage
    </a>

  <section class="brand-reminder">

    <p class="quote">
        "Setiap fitur yang kubutuhkan,<br>
        akan kubuat sendiri."
    </p>

    <span class="quote-author">
        — AsherMod
    </span>

</section>

</div>

<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>

</body>
</html>
